# The /ask API. The dashboard is a static site on GitHub Pages, not this service.
# Render Dashboard: New > Blueprint, repository NASA-flame-in-freefall, this branch.
# Render asks for GEMINI_API_KEY when the Blueprint is created (sync: false); never commit the key.
# Details: pipeline/README.md, "Deploy on Render".
services:
  - type: web
    name: flame-in-freefall-ask
    runtime: python
    plan: starter
    # The model is downloaded during the build into the project folder (only that folder
    # is kept from build to run), so the first question does not wait for it.
    buildCommand: pip install -r requirements.txt && python -m pipeline.search --download-model
    startCommand: uvicorn pipeline.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:  # the dashboard (app/) deploys separately; changes there do not rebuild this
      paths:
        - pipeline/**
        - data/out/**
        - requirements.txt
        - .python-version
        - render.yaml
    envVars:
      - key: PYTHON_VERSION  # the version the server was tested with
        value: 3.12.3
      - key: EMBEDDING_MODEL_DIR
        value: data/interim/embedding-model
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      # When Gemini's free quota runs out, NVIDIA NIM answers (free, about 40 requests a minute).
      - key: LLM_FALLBACK
        value: openai
      - key: OPENAI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OPENAI_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: OPENAI_EXTRA_BODY  # turn off the model's slow "thinking" mode
        value: '{"chat_template_kwargs": {"enable_thinking": false}}'
      - key: OPENAI_API_KEY  # the nvapi-... key from build.nvidia.com
        sync: false
      - key: ASK_ALLOWED_ORIGINS  # the dashboard on GitHub Pages
        value: https://khazar451.github.io
      - key: LLM_DAILY_LIMIT
        value: "60"
      - key: LLM_TIMEOUT_S  # a slow Gemini reply falls back to the data-only answer after this
        value: "10"
      - key: ASK_RATE_PER_MINUTE
        value: "10"
