# Builds the dashboard (app/) and publishes it to GitHub Pages.
#
# One-time setup by the repo owner: Settings > Pages > Source: "GitHub Actions".
# The site then lives at https://khazar451.github.io/NASA-flame-in-freefall/
name: Deploy dashboard

on:
  push:
    branches: [main]
    # Only what ends up in the built site: the app, and the pipeline output it
    # copies in at build time (app/scripts/sync-data.mjs).
    paths:
      - 'app/**'
      - 'data/out/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that is still waiting, but never one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # `npm run build` first copies data/out/*.json into app/public/data/.
      - run: npm run build
        env:
          # Address of the Q&A backend. Set it under Settings > Secrets and
          # variables > Actions > Variables; empty leaves the Ask tab offline.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
