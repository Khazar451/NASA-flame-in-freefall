# SAME: the table gives conditions for the four Teflon runs; the other four rows only
# say "same conditions as 1-4" for another material and are skipped.
investigation: PSI-102
table: SAME.csv
fuel_phase: solid
keep_if_not_blank: ["Air Flow (cm/s)"]
label: {column: "Sample #"}
fuel_material: {column: Sample Material}
# The table gives no oxygen or pressure. The tests ran on the ISS; the ME teammate approved
# assuming normal cabin air, as for BASS-II and Saffire, and every row says so. The dashboard
# reads a note that starts with "Oxygen" to label the test "oxygen assumed".
o2_pct:
  value: 21
  assumed: "Oxygen not in the source table; ISS cabin air (21 % oxygen) assumed."
pressure_kpa:
  value: 101.325
  assumed: "Pressure not in the source table; ISS cabin pressure (1 atm) assumed."
flow_cm_s: {column: "Air Flow (cm/s)"}
extra:
  weight_loss_rate_mg_min: {column: "Weight loss rate (mg/min)"}
  aging_duration_min: {column: "Aging Duration (minutes)"}
