# BASS-II: solid samples in the glovebox flow duct. One row per burn.
# The table gives oxygen but not pressure. BASS-II ran in the ISS cabin, so cabin
# pressure is assumed and every row says so (ME to confirm this may be shown).
# Flow: the BASS-II Summary Report (p. 74) says the air velocity was "read out to the units
# place (no decimals) yielding an effective resolution of +/-0.5 cm/s", i.e. "Air display" is
# the flow speed in cm/s. A cell often lists several readings because the flow was changed
# during the test ("5 4 3 2 1"); the first (starting) value is used and the note quotes the
# cell. Cells with no starting number ("see fan", "<1") are left empty. "Fan display" is the
# fan voltage setting, not a speed, and stays in extra.
investigation: PSI-25
table: BASS-II.csv
fuel_phase: solid
# "OR", "over" and ">500" are the gas sensor reading over its range: no number to keep.
# The last three null values start with 49, next to readings of 5 or "(5 2 0)": the fan
# setting seems mixed into the column, so the starting flow is unclear and left empty.
null_values: [none, OR, over, ">500", "see fan", "no ign at any flow", "<1", "incr to 28",
              "49 5 cm/s", "49 44 42 41 41 40.5 (5 2 0)", "7 4? (49 ?)"]
label: {column: "Test #"}
fuel_material: {column: Fuel Sample Material}
o2_pct: {column: "Calibrated initial O2 % by vol"}
pressure_kpa:
  value: 101.325
  assumed: "Pressure not in the source table; ISS cabin pressure (1 atm) assumed."
flow_cm_s: {column: Air display, parse: first_number, note_if_varied: "Air flow (cm/s)"}
diluent: {value: N2}   # PSI record: oxygen was lowered by adding nitrogen
extra:
  o2_final_pct: {column: "Calibrated final O2 % by vol"}
  co2_initial_pct: {column: "Initial CO2 % by vol"}
  co2_final_pct: {column: "Final CO2 % by vol"}
  co_initial_ppm: {column: "Initial CO (ppm)"}
  co_final_ppm: {column: "Final CO (ppm)"}
  fan_display: {column: Fan display, type: text}
  air_display: {column: Air display, type: text}
  flow_restrictor: {column: Flow restrictor, type: text}
  investigator: {column: PI, type: text}
