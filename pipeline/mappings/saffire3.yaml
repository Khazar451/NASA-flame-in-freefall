# Saffire-III: a repeat of Saffire-I at a higher flow. The table gives no oxygen or
# pressure. Like Saffire-I it burned in a Cygnus cabin, so normal cabin air is assumed
# and every row says so (ME to confirm).
investigation: PSI-100
table: SAFFIRE-3.csv
fuel_phase: solid
label: {column: Sample Number}
fuel_material: {column: Material}
o2_pct:
  value: 21
  assumed: "Oxygen not in the source table; Cygnus cabin air (21 % oxygen) assumed."
pressure_kpa:
  value: 101.325
  assumed: "Pressure not in the source table; Cygnus cabin pressure (1 atm) assumed."
flow_cm_s: {column: Air Flow, parse: first_number}   # "30 cm/s"
extra:
  flow_direction: {column: Direction, type: text}
  sample_thickness: {column: Sample Thickness, type: text}
