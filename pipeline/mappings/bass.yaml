# BASS: the table lists only the date, test numbers and the sample burned. No oxygen,
# pressure or flow is given, so these rows record which materials were tested and stay
# off the atmosphere map. Cabin air is NOT assumed, by decision of the domain lead
# (15 Nov 2026): BASS put flames out by gradually adding nitrogen, with an oxygen
# analyser fitted (BASS ERD, pp. 2, 8, 11), so oxygen fell during the tests and 21 %
# would misstate the conditions that matter.
investigation: PSI-26
table: BASS.csv
fuel_phase: solid
label: {column: "As Run Test #"}
fuel_material: {column: Fuel Sample Material}
o2_pct: null
pressure_kpa: null
flow_cm_s: null
extra:
  planned_test_number: {column: "Test #", type: text}
  sample_number: {column: "Sample #", type: text}
  date: {column: Date, type: text}
